[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visionlab"
version = "0.0.0"
description = "A local computer-vision engineering laboratory built through bounded learning and implementation phases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
